<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY PLUG 021</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header><div class="wrap">
  <a class="logo" href="#top">MY PLUG<b>021</b></a>
  <nav><a href="#shop">Shop</a><a id="fbTop" href="#" target="_blank" rel="noopener">Facebook</a><a class="btn sm" id="waTop" href="#" target="_blank" rel="noopener">WhatsApp</a></nav>
</div></header>

<main id="top">
<div class="wrap hero">
  <div class="badge"><div>Order<small>on WhatsApp</small></div></div>
  <div class="blob"></div>
  <h1><span>Your plug</span><span>for every</span><span>good thing.</span></h1>
  <p id="tagline"></p>
  <div class="btns"><a class="btn blue" href="#shop">Browse products</a><a class="btn ghost" id="waHero" href="#" target="_blank" rel="noopener">Chat with us</a></div>
</div>
<div class="marquee"><div class="track" id="m1"></div></div>

<section id="shop"><div class="wrap">
  <h2>What's available</h2>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div></section>
<div class="marquee alt"><div class="track" id="m2"></div></div>
</main>

<footer><div class="wrap">
  <div><div class="big">MY PLUG 021</div><p>Message us to order. We reply fast.</p></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" id="waFoot" href="#" target="_blank" rel="noopener">WhatsApp 0997 921 125</a><a class="btn pink" id="fbFoot" href="#" target="_blank" rel="noopener">Facebook</a></div>
</div></footer>
<a class="fab" id="fab" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">Chat on WhatsApp</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
(async()=>{
  const d = await fetchPublished(), s = d.settings, $ = id => document.getElementById(id);
  ["waTop","waHero","waFoot","fab"].forEach(i => $(i).href = waLink(s.whatsapp, "Hi MY PLUG 021, I'd like to order."));
  ["fbTop","fbFoot"].forEach(i => $(i).href = s.facebook);
  $("tagline").textContent = s.tagline || "";
  const items = (s.marquee.length ? s.marquee : ["MY PLUG 021"]);
  const strip = items.map(t => `<span>${esc(t)}</span>`).join("");
  $("m1").innerHTML = strip.repeat(6); $("m2").innerHTML = strip.repeat(6);
  let cat = "All";
  const cats = ["All", ...new Set(d.products.map(p => p.category).filter(Boolean))];
  function draw(){
    $("chips").innerHTML = cats.map(c => `<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
    const list = d.products.filter(p => cat==="All" || p.category===cat);
    $("grid").innerHTML = d.error ? `<div class="empty">Products could not load. Please refresh or message us on WhatsApp.</div>` : list.length ? list.map(p => `
      <article class="card reveal ${p.stock?"":"out"}">
        <div class="img">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:"🛍️"}${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}${p.stock?"":`<span class="tag" style="background:#ddd">Sold out</span>`}</div>
        <div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="price">${money(p.price,s)}</div>
        <a class="btn sm" target="_blank" rel="noopener" href="${waLink(s.whatsapp,`Hi MY PLUG 021, I want to order: ${p.name} (${money(p.price,s)})`)}">${p.stock?"Order on WhatsApp":"Sold out"}</a></div>
      </article>`).join("") : `<div class="empty">No products here yet. Check back soon.</div>`;
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)} }), {threshold:.1});
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  }
  $("chips").onclick = e => { if(e.target.dataset.c){cat=e.target.dataset.c;draw()} };
  draw();
})();
</script>
</body></html>
